const BASE_WIDTH = 720;
const BASE_HEIGHT = 1280;
const ASPECT_WIDTH = 9;
const ASPECT_HEIGHT = 16;
const MAX_DPR = 1.5;
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":11688544,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const canvas = document.getElementById('canvas');

(function initializeWebDiagnostics() {
	const LOG_PREFIX = '[WebDiag]';
	const LIFECYCLE_LIMIT = 20;
	const lifecycleEvents = [];
	let environment = {
		status: 'loading',
	};

	function safeError(err) {
		const name = err && typeof err.name === 'string' ? err.name : 'Error';
		const message = err && typeof err.message === 'string'
			? err.message.replace(/[\r\n\t]+/g, ' ').slice(0, 120)
			: '';
		return message ? `${name}: ${message}` : name;
	}

	function success(value) {
		return {
			status: 'success',
			value,
		};
	}

	function supported() {
		return {
			status: 'supported',
		};
	}

	function unsupported() {
		return {
			status: 'unsupported',
		};
	}

	function failed(err) {
		return {
			status: 'error',
			error: safeError(err),
		};
	}

	function safeJson(value, fallback) {
		try {
			return JSON.stringify(value);
		} catch (err) {
			return JSON.stringify({
				status: 'error',
				error: safeError(err),
				fallback,
			});
		}
	}

	function getSafeUrl() {
		try {
			const url = new URL(window.location.href);
			url.search = '';
			url.hash = '';
			return success(url.href);
		} catch (err) {
			return failed(err);
		}
	}

	function getReferrerOrigin() {
		if (!document.referrer) {
			return success('');
		}
		try {
			return success(new URL(document.referrer).origin);
		} catch (err) {
			return failed(err);
		}
	}

	function refreshCurrentEnvironment() {
		if (!environment || environment.status === 'error') {
			return;
		}
		environment.locationOrigin = success(window.location.origin);
		environment.locationPathname = success(window.location.pathname);
		environment.safeUrl = getSafeUrl();
		environment.isInIframe = success(window.self !== window.top);
		environment.visibilityState = success(document.visibilityState);
	}

	function recordLifecycle(eventName, event) {
		const entry = {
			event: eventName,
			timestampMs: Date.now(),
			visibilityState: document.visibilityState,
			persisted: event && typeof event.persisted === 'boolean' ? event.persisted : null,
			origin: window.location.origin,
		};
		lifecycleEvents.push(entry);
		if (lifecycleEvents.length > LIFECYCLE_LIMIT) {
			lifecycleEvents.splice(0, lifecycleEvents.length - LIFECYCLE_LIMIT);
		}
		console.info(`${LOG_PREFIX} lifecycle event=${eventName} persisted=${entry.persisted}`);
	}

	window.addEventListener('pageshow', (event) => recordLifecycle('pageshow', event));
	window.addEventListener('pagehide', (event) => recordLifecycle('pagehide', event));
	document.addEventListener('visibilitychange', (event) => recordLifecycle('visibilitychange', event));
	window.addEventListener('beforeunload', (event) => recordLifecycle('beforeunload', event));
	document.addEventListener('freeze', (event) => recordLifecycle('freeze', event));
	document.addEventListener('resume', (event) => recordLifecycle('resume', event));

	const diagnostics = {
		get status() {
			return environment.status;
		},
		getEnvironmentJson() {
			refreshCurrentEnvironment();
			return safeJson(environment, 'environment');
		},
		getLifecycleJson() {
			return safeJson({
				status: 'success',
				events: lifecycleEvents,
			}, 'lifecycle');
		},
	};
	window.CellCatsWebDiagnostics = diagnostics;

	async function collectEnvironment() {
		const storageSupported = typeof navigator.storage !== 'undefined';
		const hasStorageAccessSupported = typeof document.hasStorageAccess === 'function';
		const indexedDbSupported = typeof window.indexedDB !== 'undefined';
		const indexedDbDatabasesSupported = indexedDbSupported
			&& typeof window.indexedDB.databases === 'function';
		const result = {
			status: 'loading',
			locationOrigin: success(window.location.origin),
			locationPathname: success(window.location.pathname),
			safeUrl: getSafeUrl(),
			isInIframe: success(window.self !== window.top),
			referrer: success(document.referrer || ''),
			referrerOrigin: getReferrerOrigin(),
			navigatorStorage: storageSupported ? supported() : unsupported(),
			storageEstimate: storageSupported && typeof navigator.storage.estimate === 'function'
				? { status: 'loading' }
				: unsupported(),
			storagePersisted: storageSupported && typeof navigator.storage.persisted === 'function'
				? { status: 'loading' }
				: unsupported(),
			hasStorageAccessApi: hasStorageAccessSupported ? supported() : unsupported(),
			hasStorageAccess: hasStorageAccessSupported ? { status: 'loading' } : unsupported(),
			indexedDB: indexedDbSupported ? supported() : unsupported(),
			indexedDBDatabasesApi: indexedDbDatabasesSupported ? supported() : unsupported(),
			userAgent: success(navigator.userAgent || ''),
			platform: success(navigator.platform || ''),
			visibilityState: success(document.visibilityState),
			performanceTimeOrigin: typeof performance !== 'undefined'
				&& typeof performance.timeOrigin === 'number'
				? success(performance.timeOrigin)
				: unsupported(),
		};
		environment = result;

		const pending = [];
		if (result.storageEstimate.status === 'loading') {
			pending.push(Promise.resolve().then(() => navigator.storage.estimate()).then((estimate) => {
				result.storageEstimate = success({
					usage: typeof estimate.usage === 'number' ? estimate.usage : null,
					quota: typeof estimate.quota === 'number' ? estimate.quota : null,
				});
			}).catch((err) => {
				result.storageEstimate = failed(err);
			}));
		}
		if (result.storagePersisted.status === 'loading') {
			pending.push(Promise.resolve().then(() => navigator.storage.persisted()).then((isPersisted) => {
				result.storagePersisted = success(Boolean(isPersisted));
			}).catch((err) => {
				result.storagePersisted = failed(err);
			}));
		}
		if (result.hasStorageAccess.status === 'loading') {
			pending.push(Promise.resolve().then(() => document.hasStorageAccess()).then((hasAccess) => {
				result.hasStorageAccess = success(Boolean(hasAccess));
			}).catch((err) => {
				result.hasStorageAccess = failed(err);
			}));
		}

		await Promise.all(pending);
		result.status = 'ready';
		environment = result;
		console.info(`${LOG_PREFIX} initialized origin=${window.location.origin}`);
	}

	collectEnvironment().catch((err) => {
		environment = {
			status: 'error',
			error: safeError(err),
		};
		console.warn(`${LOG_PREFIX} initialization error=${safeError(err)}`);
	});
}());

GODOT_CONFIG.canvasResizePolicy = 0;

let resizeFrame = 0;

function resizeCanvas() {
	resizeFrame = 0;
	const viewport = window.visualViewport;
	const layoutWidth = Math.max(1, document.documentElement.clientWidth || window.innerWidth || BASE_WIDTH);
	const layoutHeight = Math.max(1, document.documentElement.clientHeight || window.innerHeight || BASE_HEIGHT);
	const availableWidth = Math.max(1, Math.min(layoutWidth, viewport ? viewport.width : layoutWidth));
	const availableHeight = Math.max(1, Math.min(layoutHeight, viewport ? viewport.height : layoutHeight));
	const viewportOffsetLeft = viewport
		? Math.max(0, Math.min(viewport.offsetLeft || 0, layoutWidth - availableWidth))
		: 0;
	const viewportOffsetTop = viewport
		? Math.max(0, Math.min(viewport.offsetTop || 0, layoutHeight - availableHeight))
		: 0;
	const scale = Math.min(availableWidth / BASE_WIDTH, availableHeight / BASE_HEIGHT);
	const cssAspectUnit = Math.floor(Math.min(
		(BASE_WIDTH * scale) / ASPECT_WIDTH,
		(BASE_HEIGHT * scale) / ASPECT_HEIGHT,
	));
	const cssWidth = Math.max(1, ASPECT_WIDTH * cssAspectUnit);
	const cssHeight = Math.max(1, ASPECT_HEIGHT * cssAspectUnit);
	const left = Math.round(viewportOffsetLeft + (availableWidth - cssWidth) * 0.5);
	const top = Math.round(viewportOffsetTop + (availableHeight - cssHeight) * 0.5);
	const renderScale = Math.min(window.devicePixelRatio || 1, MAX_DPR);
	const backingAspectUnit = Math.floor(Math.min(
		(cssWidth * renderScale) / ASPECT_WIDTH,
		(cssHeight * renderScale) / ASPECT_HEIGHT,
	));
	const backingWidth = Math.max(1, ASPECT_WIDTH * backingAspectUnit);
	const backingHeight = Math.max(1, ASPECT_HEIGHT * backingAspectUnit);

	canvas.style.width = `${cssWidth}px`;
	canvas.style.height = `${cssHeight}px`;
	canvas.style.left = `${left}px`;
	canvas.style.top = `${top}px`;

	if (canvas.width !== backingWidth || canvas.height !== backingHeight) {
		canvas.width = backingWidth;
		canvas.height = backingHeight;
	}
}

function scheduleCanvasResize() {
	if (resizeFrame !== 0) {
		return;
	}
	resizeFrame = window.requestAnimationFrame(resizeCanvas);
}

resizeCanvas();
window.addEventListener('resize', scheduleCanvasResize);
document.addEventListener('fullscreenchange', scheduleCanvasResize);
if (window.visualViewport) {
	window.visualViewport.addEventListener('resize', scheduleCanvasResize);
}
if ('ResizeObserver' in window) {
	const resizeObserver = new ResizeObserver(scheduleCanvasResize);
	resizeObserver.observe(document.documentElement);
}

const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG.serviceWorker && GODOT_CONFIG.ensureCrossOriginIsolationHeaders && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			canvas,
			canvasResizePolicy: 0,
			onProgress(current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			scheduleCanvasResize();
		}, displayFailureNotice);
	}
}());
